<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TIA · TRAMA</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --text: #2c3e2f;
      --muted: #6b7c6e;
      --accent: #4a7c59;
      --accent-dark: #3d6649;
      --user-bg: #e8f0ea;
      --bot-bg: #ffffff;
      --border: #d8e0da;
    }

    * { box-sizing: border-box; }

    html, body { overflow-x: hidden; }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    header img {
      height: 48px;
      width: auto;
      border-radius: 6px;
      flex-shrink: 0;
    }

    header > div {
      flex: 1;
      min-width: 0;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      min-width: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .consulta-id {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
      flex-shrink: 0;
    }

    header p {
      margin: 0.15rem 0 0;
      font-size: 0.85rem;
      line-height: 1.35;
      color: var(--muted);
      overflow-wrap: break-word;
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }

    .bubble {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 0.25rem;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0.25rem;
    }

    .bubble.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      max-width: 100%;
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem 1.25rem;
    }

    .composer {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 1rem;
      outline: none;
    }

    .composer input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(74, 124, 89, 0.15);
    }

    .composer button {
      flex-shrink: 0;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .composer button:hover { background: var(--accent-dark); }
    .composer button:disabled { opacity: 0.6; cursor: wait; }

    .toolbar {
      max-width: 720px;
      width: 100%;
      margin: 0 auto 0.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .toolbar span {
      flex: 1 1 12rem;
      min-width: 0;
    }

    .toolbar button {
      flex: 0 0 auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .toolbar button:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 480px) {
      header {
        padding: 0.75rem 1rem;
      }

      footer {
        padding: 0.5rem 1rem 0.75rem;
      }

      #chat {
        padding: 1rem;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
        margin-bottom: 0.5rem;
        gap: 0.4rem;
      }

      .toolbar span {
        flex: 0 0 auto;
      }

      .toolbar button {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="/static/logo-trama.jpg" alt="TRAMA">
    <div>
      <div class="title-row">
        <h1>TIA · TRAMA</h1>
        <span id="consulta-id" class="consulta-id" hidden></span>
      </div>
      <p>Preguntame sobre clases de yoga, entrenamiento funcional, talleres, servicios de salud, bienestar y más 🌿</p>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div class="toolbar">
      <span>Escribí <strong>chau</strong>, <strong>salir</strong> o <strong>fin</strong> para terminar.</span>
      <button type="button" id="new-chat">Nueva consulta</button>
    </div>
    <form class="composer" id="form">
      <input id="input" type="text" placeholder="Escribí tu mensaje…" autocomplete="off" required>
      <button type="submit" id="send">Enviar</button>
    </form>
  </footer>

  <script>
    const STORAGE_KEY = "tia_session_id";
    const SESSION_END_REPLY =
      "¡Hasta pronto! 🌿 Escribí de nuevo cuando quieras retomar.";

    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("form");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("new-chat");

    function createSessionId() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (char) => {
        const n = Math.floor(Math.random() * 16);
        const value = char === "x" ? n : (n & 0x3) | 0x8;
        return value.toString(16);
      });
    }

    function getSessionId() {
      let id = localStorage.getItem(STORAGE_KEY);
      if (!id) {
        id = createSessionId();
        localStorage.setItem(STORAGE_KEY, id);
      }
      return id;
    }

    function clearSessionId() {
      localStorage.removeItem(STORAGE_KEY);
    }

    function appendBubble(text, role) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      div.textContent = text;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function setConsultaId(id) {
      const el = document.getElementById("consulta-id");
      if (!el) return;
      if (id == null || id === "") {
        el.hidden = true;
        el.textContent = "";
        return;
      }
      el.textContent = "#" + id;
      el.hidden = false;
    }

    function resetUi(message) {
      chatEl.innerHTML = "";
      setConsultaId(null);
      if (message) {
        appendBubble(message, "system");
      }
    }

    async function endSessionOnServer(sessionId) {
      try {
        await fetch("/end/" + encodeURIComponent(sessionId), { method: "POST" });
      } catch (_) {
        /* ignore network errors on reset */
      }
    }

    async function startNewChat() {
      const sessionId = localStorage.getItem(STORAGE_KEY);
      if (sessionId) {
        await endSessionOnServer(sessionId);
      }
      clearSessionId();
      resetUi("Nueva consulta. Escribí tu mensaje para empezar.");
      inputEl.focus();
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      let sessionId;
      try {
        sessionId = getSessionId();
      } catch (err) {
        appendBubble("No pude iniciar la sesión en este navegador. Probá recargar la página.", "system");
        console.error(err);
        return;
      }

      appendBubble(message, "user");
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message, origin: "web" }),
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        if (data.consulta_id != null) {
          setConsultaId(data.consulta_id);
        }
        appendBubble(data.reply, "bot");

        if (data.reply === SESSION_END_REPLY) {
          clearSessionId();
          appendBubble("Escribí de nuevo para empezar otra consulta.", "system");
        }
      } catch (err) {
        appendBubble("Perdón, no pude conectar con TIA. Probá de nuevo.", "system");
        console.error(err);
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    newChatBtn.addEventListener("click", startNewChat);

    resetUi();
    inputEl.focus();
  </script>
</body>
</html>
