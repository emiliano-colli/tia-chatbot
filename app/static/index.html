<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
  <title>TIA · TRAMA</title>
  <style>
    :root {
      --bg: #f7f5f2;
      --surface: #ffffff;
      --text: #2c3e2f;
      --muted: #6b7c6e;
      --accent: #4a7c59;
      --accent-dark: #3d6649;
      --user-bg: #e8f0ea;
      --bot-bg: #ffffff;
      --border: #d8e0da;
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
    }

    header {
      flex-shrink: 0;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 1rem 1.25rem;
      display: flex;
      align-items: flex-start;
      gap: 1rem;
    }

    header img {
      height: 48px;
      width: auto;
      border-radius: 6px;
      flex-shrink: 0;
    }

    header > div {
      flex: 1;
      min-width: 0;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      min-width: 0;
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }

    .consulta-id {
      font-size: 0.75rem;
      font-weight: 400;
      color: var(--muted);
      flex-shrink: 0;
    }

    header p {
      margin: 0.15rem 0 0;
      font-size: 0.85rem;
      line-height: 1.35;
      color: var(--muted);
      overflow-wrap: break-word;
    }

    #chat {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
    }

    .bubble {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: 1rem;
      line-height: 1.45;
      word-break: break-word;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user-bg);
      border-bottom-right-radius: 0.25rem;
      white-space: pre-wrap;
    }

    .bubble.bot {
      align-self: flex-start;
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 0.25rem;
    }

    .bubble.bot p {
      margin: 0 0 0.5em;
    }

    .bubble.bot p:last-child {
      margin-bottom: 0;
    }

    .bubble.bot ul,
    .bubble.bot ol {
      margin: 0.25em 0 0.5em;
      padding-left: 1.25em;
    }

    .bubble.bot li {
      margin: 0.15em 0;
    }

    .bubble.bot a {
      color: var(--accent-dark);
      overflow-wrap: anywhere;
    }

    .bubble.bot .md-heading {
      font-weight: 600;
      margin: 0.6em 0 0.35em;
    }

    .bubble.bot .md-heading:first-child {
      margin-top: 0;
    }

    .bubble.bot .md-heading::before {
      content: "▸ ";
      color: var(--accent);
    }

    .bubble.system {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      text-align: center;
      max-width: 100%;
      white-space: pre-wrap;
    }

    footer {
      flex-shrink: 0;
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 1rem 1.25rem 1.25rem;
    }

    .composer {
      max-width: 720px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 0.5rem;
    }

    .composer input {
      flex: 1;
      min-width: 0;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 1rem;
      outline: none;
    }

    .composer input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(74, 124, 89, 0.15);
    }

    .composer button {
      flex-shrink: 0;
      padding: 0.75rem 1.25rem;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .composer button:hover { background: var(--accent-dark); }
    .composer button:disabled { opacity: 0.6; cursor: wait; }

    .toolbar {
      max-width: 720px;
      width: 100%;
      margin: 0 auto 0.75rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem 1rem;
      font-size: 0.85rem;
      color: var(--muted);
    }

    .toolbar span {
      flex: 1 1 12rem;
      min-width: 0;
    }

    .toolbar button {
      flex: 0 0 auto;
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }

    .toolbar button:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 480px) {
      header {
        padding: 0.75rem 1rem;
      }

      footer {
        padding: 0.5rem 1rem 0.75rem;
      }

      #chat {
        padding: 1rem;
      }

      .toolbar {
        flex-direction: column;
        align-items: stretch;
        margin-bottom: 0.5rem;
        gap: 0.4rem;
      }

      .toolbar span {
        flex: 0 0 auto;
      }

      .toolbar button {
        align-self: flex-start;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="/static/logo-trama.jpg" alt="TRAMA">
    <div>
      <div class="title-row">
        <h1>TIA · TRAMA</h1>
        <span id="consulta-id" class="consulta-id" hidden></span>
      </div>
      <p>Preguntame sobre clases de yoga, entrenamiento funcional, talleres, servicios de salud, bienestar y más 🌿</p>
    </div>
  </header>

  <main id="chat" aria-live="polite"></main>

  <footer>
    <div class="toolbar">
      <span>Escribí <strong>chau</strong>, <strong>salir</strong> o <strong>fin</strong> para terminar.</span>
      <button type="button" id="new-chat">Nueva consulta</button>
    </div>
    <form class="composer" id="form">
      <input id="input" type="text" placeholder="Escribí tu mensaje…" autocomplete="off" required>
      <button type="submit" id="send">Enviar</button>
    </form>
  </footer>

  <script>
    const STORAGE_KEY = "tia_session_id";
    const SESSION_END_REPLY =
      "¡Hasta pronto! 🌿 Escribí de nuevo cuando quieras retomar.";

    const chatEl = document.getElementById("chat");
    const formEl = document.getElementById("form");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const newChatBtn = document.getElementById("new-chat");

    function createSessionId() {
      if (typeof crypto !== "undefined" && typeof crypto.randomUUID === "function") {
        return crypto.randomUUID();
      }
      return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, (char) => {
        const n = Math.floor(Math.random() * 16);
        const value = char === "x" ? n : (n & 0x3) | 0x8;
        return value.toString(16);
      });
    }

    function getSessionId() {
      let id = localStorage.getItem(STORAGE_KEY);
      if (!id) {
        id = createSessionId();
        localStorage.setItem(STORAGE_KEY, id);
      }
      return id;
    }

    function clearSessionId() {
      localStorage.removeItem(STORAGE_KEY);
    }

    function isUlLine(line) {
      return /^[-*] /.test(line);
    }

    function isOlLine(line) {
      return /^\d+\. /.test(line);
    }

    function isHeadingLine(line) {
      return /^#{1,6}\s+/.test(line);
    }

    function skipBlanks(lines, i) {
      while (i < lines.length && lines[i].trim() === "") {
        i += 1;
      }
      return i;
    }

    function appendInline(parent, text) {
      const tokenRe = /(\*\*[^*]+\*\*)|(https?:\/\/[^\s<]+)/g;
      let last = 0;
      let match;
      while ((match = tokenRe.exec(text)) !== null) {
        if (match.index > last) {
          parent.appendChild(document.createTextNode(text.slice(last, match.index)));
        }
        if (match[1]) {
          const strong = document.createElement("strong");
          strong.textContent = match[1].slice(2, -2);
          parent.appendChild(strong);
        } else if (match[2]) {
          let href = match[2].replace(/[),.;!?]+$/, "");
          const trailing = match[2].slice(href.length);
          const a = document.createElement("a");
          a.href = href;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = href;
          parent.appendChild(a);
          if (trailing) {
            parent.appendChild(document.createTextNode(trailing));
          }
        }
        last = match.index + match[0].length;
      }
      if (last < text.length) {
        parent.appendChild(document.createTextNode(text.slice(last)));
      }
    }

    function renderBotMarkdown(container, text) {
      const lines = String(text).replace(/\r\n/g, "\n").split("\n");
      let i = 0;
      while (i < lines.length) {
        i = skipBlanks(lines, i);
        if (i >= lines.length) {
          break;
        }
        if (isHeadingLine(lines[i])) {
          const heading = document.createElement("p");
          heading.className = "md-heading";
          appendInline(heading, lines[i].replace(/^#{1,6}\s+/, ""));
          container.appendChild(heading);
          i += 1;
          continue;
        }
        if (isUlLine(lines[i])) {
          const ul = document.createElement("ul");
          while (true) {
            i = skipBlanks(lines, i);
            if (i >= lines.length || !isUlLine(lines[i])) {
              break;
            }
            const li = document.createElement("li");
            appendInline(li, lines[i].replace(/^[-*] /, ""));
            ul.appendChild(li);
            i += 1;
          }
          container.appendChild(ul);
          continue;
        }
        if (isOlLine(lines[i])) {
          const ol = document.createElement("ol");
          while (true) {
            i = skipBlanks(lines, i);
            if (i >= lines.length || !isOlLine(lines[i])) {
              break;
            }
            const li = document.createElement("li");
            appendInline(li, lines[i].replace(/^\d+\. /, ""));
            ol.appendChild(li);
            i += 1;
          }
          container.appendChild(ol);
          continue;
        }
        const paraLines = [];
        while (
          i < lines.length &&
          lines[i].trim() !== "" &&
          !isHeadingLine(lines[i]) &&
          !isUlLine(lines[i]) &&
          !isOlLine(lines[i])
        ) {
          paraLines.push(lines[i]);
          i += 1;
        }
        const p = document.createElement("p");
        paraLines.forEach((line, idx) => {
          if (idx > 0) {
            p.appendChild(document.createElement("br"));
          }
          appendInline(p, line);
        });
        container.appendChild(p);
      }
    }

    function scrollChatToEnd() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function syncVisualViewport() {
      const vv = window.visualViewport;
      if (vv) {
        document.body.style.height = vv.height + "px";
      }
      scrollChatToEnd();
    }

    function scheduleScrollToEnd() {
      scrollChatToEnd();
      requestAnimationFrame(scrollChatToEnd);
      setTimeout(scrollChatToEnd, 250);
    }

    function appendBubble(text, role) {
      const div = document.createElement("div");
      div.className = "bubble " + role;
      if (role === "bot") {
        renderBotMarkdown(div, text);
      } else {
        div.textContent = text;
      }
      chatEl.appendChild(div);
      scheduleScrollToEnd();
    }

    function setConsultaId(id) {
      const el = document.getElementById("consulta-id");
      if (!el) return;
      if (id == null || id === "") {
        el.hidden = true;
        el.textContent = "";
        return;
      }
      el.textContent = "#" + id;
      el.hidden = false;
    }

    function resetUi(message) {
      while (chatEl.firstChild) {
        chatEl.removeChild(chatEl.firstChild);
      }
      setConsultaId(null);
      if (message) {
        appendBubble(message, "system");
      }
    }

    async function endSessionOnServer(sessionId) {
      try {
        await fetch("/end/" + encodeURIComponent(sessionId), { method: "POST" });
      } catch (_) {
        /* ignore network errors on reset */
      }
    }

    async function startNewChat() {
      const sessionId = localStorage.getItem(STORAGE_KEY);
      if (sessionId) {
        await endSessionOnServer(sessionId);
      }
      clearSessionId();
      resetUi("Nueva consulta. Escribí tu mensaje para empezar.");
      inputEl.focus();
    }

    formEl.addEventListener("submit", async (event) => {
      event.preventDefault();
      const message = inputEl.value.trim();
      if (!message) return;

      let sessionId;
      try {
        sessionId = getSessionId();
      } catch (err) {
        appendBubble("No pude iniciar la sesión en este navegador. Probá recargar la página.", "system");
        console.error(err);
        return;
      }

      appendBubble(message, "user");
      inputEl.value = "";
      inputEl.disabled = true;
      sendBtn.disabled = true;

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ session_id: sessionId, message, origin: "web" }),
        });

        if (!response.ok) {
          throw new Error("HTTP " + response.status);
        }

        const data = await response.json();
        if (data.consulta_id != null) {
          setConsultaId(data.consulta_id);
        }
        appendBubble(data.reply, "bot");

        if (data.reply === SESSION_END_REPLY) {
          clearSessionId();
          appendBubble("Escribí de nuevo para empezar otra consulta.", "system");
        }
      } catch (err) {
        appendBubble("Perdón, no pude conectar con TIA. Probá de nuevo.", "system");
        console.error(err);
      } finally {
        inputEl.disabled = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    });

    newChatBtn.addEventListener("click", startNewChat);

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", syncVisualViewport);
      window.visualViewport.addEventListener("scroll", syncVisualViewport);
      syncVisualViewport();
    }
    inputEl.addEventListener("focus", scheduleScrollToEnd);

    resetUi();
    inputEl.focus();
  </script>
</body>
</html>
